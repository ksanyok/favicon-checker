name: 'Favicon Checker by PromoPilot'
description: 'Check that a website serves valid favicons (link rel=icon, apple-touch-icon, manifest, /favicon.ico).'
author: 'Alexandr Krikun'
branding:
  icon: 'image'
  color: 'purple'
inputs:
  args:
    description: 'Arguments passed to the favicon-checker CLI, e.g. "example.com"'
    required: true
runs:
  using: composite
  steps:
    - name: Run favicon-checker
      shell: bash
      run: node "$GITHUB_ACTION_PATH/bin/cli.js" ${{ inputs.args }}
